name: Check game loads

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Loads every game file headless and plays one seeded campaign; fails on a script error
      - run: node tools/q.js villain
      - run: node tests/gameplay-text.cjs
      - run: node tests/payload-bombs.cjs
      - run: node tests/cantor-rework.cjs
      - run: node tests/balance.cjs
      - run: node tests/boss-selection.cjs
      - run: node tools/sim.js --runs 1 --abil
