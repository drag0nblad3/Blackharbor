<title>Blackharbor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bangers&family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: comic-issue frame — masthead with halftone, panel-bordered sections, narration-box captions; one column on phones */
:root{
  --set:#1C8A4A; --setBg:#E2F4E8; --setGlow:rgba(40,190,100,.5);
  --paper:#EDF0F4; --panel:#FFFFFF; --ink:#151821; --muted:#596173; --line:#C4CAD5;
  --cyan:#0B86AE; --magenta:#C92463; --yellow:#F1C02C; --good:#2F8A4E; --dot:rgba(21,24,33,.13);
  --cap:#FCE9A6; --capInk:#2A2410;
  --tech:#0B86AE; --innate:#C0561C; --magic:#7A3FC0;
  --sfx:"Bangers","Bowlby One",Impact,sans-serif;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --set:#5BD88A; --setBg:#11281B; --setGlow:rgba(91,216,138,.45);
  --paper:#0E1119; --panel:#171B26; --ink:#E7EAF1; --muted:#9AA1B2; --line:#2C3242;
  --cyan:#3DB6DD; --magenta:#EE548C; --yellow:#F3CB4B; --good:#5BC27D; --dot:rgba(231,234,241,.08);
  --cap:#3A3214; --capInk:#F6E7B0; --tech:#3DB6DD; --innate:#F08A4B; --magic:#B48CF0; color-scheme:dark}}
:root[data-theme="dark"]{
  --set:#5BD88A; --setBg:#11281B; --setGlow:rgba(91,216,138,.45);
  --paper:#0E1119; --panel:#171B26; --ink:#E7EAF1; --muted:#9AA1B2; --line:#2C3242;
  --cyan:#3DB6DD; --magenta:#EE548C; --yellow:#F3CB4B; --good:#5BC27D; --dot:rgba(231,234,241,.08);
  --cap:#3A3214; --capInk:#F6E7B0; --tech:#3DB6DD; --innate:#F08A4B; --magic:#B48CF0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 24px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.7rem;line-height:1}
h2{font-size:1.15rem}
h3{font-size:1rem}
.mast{border:2.5px solid var(--ink);background:var(--panel);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.5px);background-size:6px 6px;padding:8px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.mast small{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.issue{border:2.5px solid var(--ink);background:var(--yellow);color:#151821;padding:4px 10px;font-family:var(--display);font-size:1.05rem;white-space:nowrap}
.res{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--panel);padding:3px 8px;font-size:.78rem;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{font-family:var(--body);font-weight:800;letter-spacing:.06em;font-size:.68rem;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip.trust{border-color:var(--cyan)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{flex:1 1 0;min-width:0}
.nav .btn.glow{animation:navglow 2.6s ease-in-out infinite}
@keyframes navglow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 12px 3px color-mix(in srgb,var(--yellow) 75%,transparent)}}
@media (prefers-reduced-motion:reduce){.nav .btn.glow{animation:none;box-shadow:0 0 9px 2px color-mix(in srgb,var(--yellow) 65%,transparent)}}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{border:2px solid var(--ink);background:var(--panel);padding:8px 12px;font-weight:800;font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.pri{background:var(--magenta);color:#fff;border-color:var(--ink)}
.btn.on{background:var(--cyan);color:#fff}
.btn.sm{padding:5px 8px;font-size:.72rem;box-shadow:2px 2px 0 var(--ink)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.panel{border:2.5px solid var(--ink);background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:9px;min-width:0}
.eyebrow{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.card{border:1.5px solid var(--line);padding:9px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--panel)}
.card.built{border-color:var(--good)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.cap{background:var(--cap);color:var(--capInk);border:2px solid var(--ink);padding:7px 10px;font-size:.9rem}
.cap.tilt{transform:rotate(-.4deg)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pip{width:12px;height:16px;border:1.5px solid var(--ink);background:var(--panel)}
.pip.f{background:var(--magenta)}
.pip.w{background:repeating-linear-gradient(45deg,var(--muted) 0 2px,transparent 2px 5px)}
.pip.d{background:var(--line)}
.meter{display:flex;gap:3px}
.meter i{width:18px;height:8px;border:1.5px solid var(--ink)}
.meter i.f{background:var(--yellow)}
.lvl{font-family:var(--mono);font-size:.75rem;border:1.5px solid var(--ink);padding:1px 6px}
.stamp{font-family:var(--display);color:var(--good);border:2.5px solid var(--good);padding:2px 8px;transform:rotate(-4deg);display:inline-block;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.stat{border:1px solid var(--line);padding:4px 2px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:1rem}
.stat span{font-size:.62rem;letter-spacing:.1em;color:var(--muted);font-weight:700}
.bar{height:8px;border:1.5px solid var(--ink);background:var(--paper);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--good)}
.bar.c i{background:var(--cyan)}
.tag{font-size:.72rem;border:1.5px solid var(--magenta);color:var(--magenta);padding:1px 6px;font-weight:700}
.tag.g{border-color:var(--cyan);color:var(--cyan)}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:6px;border:1.5px solid var(--ink)}
.steps span.f{background:var(--cyan)}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;align-items:flex-start;text-transform:none;letter-spacing:0}
.opt small{font-weight:400;font-size:.8rem;color:var(--muted)}
.opt:disabled small{color:inherit}
/* board */
.boardwrap{display:flex;justify-content:center}
.board{position:relative;width:100%;max-width:620px;border:2.5px solid var(--ink);background:var(--panel);--hex:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
/* hex cells: the outer hex is the border colour, ::after is the fill, so state classes only swap --cb, --cf and --ci */
.cell{position:absolute;border:0;padding:0;margin:0;clip-path:var(--hex);background:var(--cb,var(--line));cursor:pointer}
.cell::after{content:"";position:absolute;inset:var(--ci,1.5px);clip-path:var(--hex);background:var(--cf,var(--panel))}
.cell.blind{--cf:color-mix(in srgb,var(--ink) 10%,var(--panel))}
.cell.front{--cf:color-mix(in srgb,var(--magenta) 9%,var(--panel))}
.cell.exit{--cf:color-mix(in srgb,var(--good) 32%,var(--panel));--cb:var(--good)}
.cell.obs{--cf:repeating-linear-gradient(135deg,var(--line) 0 3px,var(--panel) 3px 7px)}
.cell.reach{--cf:color-mix(in srgb,var(--cyan) 24%,var(--panel))}
.cell.tgt{--cb:var(--magenta);--ci:4px}
.cell.ally{--cb:var(--good);--ci:4px}
.tok{position:absolute;display:grid;place-items:center;pointer-events:none}
.tok .h{width:76%;height:76%;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:clamp(.7rem,3.4vw,1.05rem);color:#fff;position:relative}
.tok.sel .h{outline:3px solid var(--yellow);outline-offset:1px}
.tok.done .h{filter:saturate(.35)}
.tok.ko .h{opacity:.35}
.tok .hp{position:absolute;left:8%;right:8%;bottom:16%;height:4px;background:var(--paper);border:1px solid var(--ink)}
.tok .cp{position:absolute;left:8%;right:8%;bottom:4%;height:4px;background:var(--paper);border:1px solid var(--ink)}
.tok .cp i{display:block;height:100%;background:#3DB6DD}
.tok .sh{position:absolute;top:-5px;left:-5px;width:15px;height:15px;border-radius:50%;background:var(--magenta);border:1.5px solid var(--ink);color:#fff;font-family:var(--sfx);font-size:.7rem;display:grid;place-items:center;line-height:1}
.tok .hp i{display:block;height:100%;background:var(--good)}
.tok .gd{position:absolute;top:-4px;right:-4px;width:12px;height:12px;background:var(--yellow);border:1.5px solid var(--ink);transform:rotate(45deg)}
.tok .hm{width:58%;height:58%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--mono);font-size:.68rem;font-weight:700}
.tok .cv{width:44%;height:44%;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);position:relative}
/* civilians: followers wear their hero's colour, held ones a dark ring, loose ones with nobody beside them sweat (they panic on the villain turn) */
.tok .cv.fol{box-shadow:0 0 0 2.5px var(--fc),0 0 0 4px var(--ink)}
.tok .cv.held{box-shadow:0 0 0 3px var(--ink);background:color-mix(in srgb,var(--yellow) 60%,var(--ink))}
.tok .cv .pz{position:absolute;top:-9px;right:-9px;width:13px;height:13px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);color:var(--magenta);font-family:var(--sfx);font-size:.62rem;display:grid;place-items:center;line-height:1}
.tok.panic .cv{animation:shake .32s linear 3}
.tok.panic::before,.tok.panic::after{content:"";position:absolute;width:5px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#3DB6DD;border:1.5px solid var(--ink);top:6%;animation:sweat .9s ease-out forwards}
.tok.panic::before{left:16%;transform:rotate(-25deg)}.tok.panic::after{right:16%;transform:rotate(25deg);animation-delay:.12s}
@keyframes sweat{from{opacity:1;translate:0 0}to{opacity:0;translate:0 10px}}
.fx.k-panic .b::after{background:#fff;clip-path:polygon(50% 0,61% 22%,86% 12%,80% 38%,100% 50%,80% 62%,86% 88%,61% 78%,50% 100%,39% 78%,14% 88%,20% 62%,0 50%,20% 38%,14% 12%,39% 22%)}
.fx.k-panic .b::before{clip-path:polygon(50% 0,61% 22%,86% 12%,80% 38%,100% 50%,80% 62%,86% 88%,61% 78%,50% 100%,39% 78%,14% 88%,20% 62%,0 50%,20% 38%,14% 12%,39% 22%)}
.fx.k-panic .b{width:clamp(56px,15vw,84px)}
.fx.k-panic .b span{color:var(--ink);font-size:clamp(.8rem,3.6vw,1.15rem)}
.tok .ex{font-family:var(--mono);font-size:.5rem;font-weight:700;color:var(--ink);letter-spacing:.06em}
/* villains: one hex per footprint cell, a label at the centroid and a facing arrow */
.vtok{position:absolute;pointer-events:none;z-index:2}
.vtok .vc{position:absolute;width:100%;height:100%;clip-path:var(--hex);background:var(--ink)}
.vtok .vc::after{content:"";position:absolute;inset:3px;clip-path:var(--hex);background-color:var(--magenta);background-image:radial-gradient(rgba(0,0,0,.18) 1.2px,transparent 1.6px);background-size:5px 5px}
.vtok .vl{position:absolute;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;line-height:1.05;z-index:2}
.vtok .vl b{font-family:var(--display);font-size:clamp(.5rem,2.4vw,.85rem);-webkit-text-stroke:.6px #151821;paint-order:stroke fill;white-space:nowrap}
.vtok .vl small{font-family:var(--mono);font-size:.56rem}
.vtok .face{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%) rotate(var(--fa));z-index:3}
.vtok .face i{position:absolute;right:-4px;top:50%;width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:13px solid var(--yellow);transform:translateY(-50%);filter:drop-shadow(1.5px 0 0 #151821) drop-shadow(-1px 0 0 #151821)}
.vtok .vc.seg{transform:scale(.74)}
.vtok .vc.sw-sting::after{background-color:#B0306A}
.vtok .vc.sw-shell::after{background-color:#7A5AA8}
.vtok .face.hid{transform:translate(-50%,-50%)}
.vtok .face.hid em{position:absolute;right:-2px;top:-2px;font-style:normal;font-family:var(--display);font-size:1rem;color:var(--yellow);-webkit-text-stroke:.7px #151821;paint-order:stroke fill}
.vtok .spine{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.vtok .vc.meal::after{background-image:radial-gradient(circle,var(--yellow) 0 20%,#151821 21% 27%,transparent 28%),radial-gradient(rgba(0,0,0,.18) 1.2px,transparent 1.6px);background-size:100% 100%,5px 5px}
.vtok.focus{filter:drop-shadow(0 0 3px var(--yellow)) drop-shadow(0 0 1px var(--yellow))}
.shout{position:absolute;z-index:7;cursor:pointer;transform:translate(-50%,-100%);margin-top:-20px;max-width:62%;background:var(--panel);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;padding:5px 10px;font-family:var(--sfx);font-size:clamp(.8rem,3.2vw,1.05rem);letter-spacing:.02em;line-height:1.1;text-align:center;pointer-events:auto;box-shadow:3px 3px 0 var(--magenta);animation:shoutIn .35s cubic-bezier(.2,1.4,.5,1)}
.shout::after{content:"";position:absolute;left:44%;bottom:-11px;width:14px;height:11px;background:var(--ink);clip-path:polygon(0 0,100% 0,20% 100%)}
.shout.below{transform:translate(-50%,0);margin-top:14px;animation-name:shoutInB}
.shout.below::after{bottom:auto;top:-11px;clip-path:polygon(20% 0,100% 100%,0 100%)}
@keyframes shoutInB{from{transform:translate(-50%,0) scale(.4) rotate(-6deg);opacity:0}}
@keyframes shoutIn{from{transform:translate(-50%,-100%) scale(.4) rotate(-6deg);opacity:0}}
.log{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto;font-size:.82rem}
.log p{margin:0;padding:4px 8px;border-left:3px solid var(--line)}
.log p.vill{border-color:var(--magenta)}
.log p.hero{border-color:var(--cyan)}
.log p.sys{border-color:var(--yellow);color:var(--muted)}
.big{font-family:var(--display);font-size:2rem;line-height:1}
ul.lines{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.sw{width:12px;height:12px;border:1.5px solid var(--ink);display:inline-block}
.board{background-image:radial-gradient(var(--dot) 1px,transparent 1.4px);background-size:7px 7px}
.cap.warn{background:#151821;color:#F1C02C;border-color:#F1C02C}
.boardwrap{overflow:clip;padding:4px 0}
/* comic SFX */
.fx{position:absolute;z-index:6;pointer-events:none;transform:translate(-50%,-50%);animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-14deg);opacity:0}12%{transform:translate(-50%,-50%) scale(1.18) rotate(4deg);opacity:1}24%{transform:translate(-50%,-50%) scale(1) rotate(0)}78%{opacity:1}100%{transform:translate(-50%,-62%) scale(1.04);opacity:0}}
.fx .b{position:relative;width:clamp(66px,19vw,104px);aspect-ratio:1;display:grid;place-items:center}
.fx .b::before,.fx .b::after{content:"";position:absolute}
.fx .b::before{inset:0;background:var(--ink)}
.fx .b::after{inset:5px;background:var(--yellow)}
.fx .b span{position:relative;z-index:1;font-family:var(--sfx);font-size:clamp(1.05rem,4.8vw,1.6rem);letter-spacing:.03em;color:var(--magenta);-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill;transform:rotate(-8deg);white-space:nowrap}
.fx.k-vhit .b::after{background:var(--magenta)}
.fx.k-vhit .b span{color:#fff}
.fx.k-miss .b{width:clamp(56px,15vw,84px)}
.fx.k-miss .b::after{background:var(--panel)}
.fx.k-miss .b span{color:var(--ink);-webkit-text-stroke:0;font-size:clamp(.9rem,3.8vw,1.2rem)}
.fx.k-good .b::after{background:var(--cyan)}
.fx.k-good .b span{color:#fff}
.fx.k-say .b{width:auto;aspect-ratio:auto;padding:6px 12px;background:var(--panel);border:2.5px solid var(--ink);border-radius:50%/45%}
.fx.k-say .b::before{inset:auto auto -11px 30%;width:14px;height:12px;background:var(--ink);clip-path:polygon(0 0,100% 0,10% 100%)}
.fx.k-say .b::after{display:none}
.fx.k-say .b span{color:var(--ink);-webkit-text-stroke:0;transform:none;font-size:clamp(.85rem,3.6vw,1.1rem)}
.fx.k-say{animation-duration:1.6s}
.sfxhead{font-family:var(--sfx);font-size:3rem;line-height:1;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);transform:rotate(-3deg);display:inline-block;letter-spacing:.03em}
.sfxhead.bad{color:var(--magenta)}
/* disciplines & gear */
.t-tech{--tc:var(--tech)}.t-innate{--tc:var(--innate)}.t-magic{--tc:var(--magic)}
.disc{border:1.5px solid var(--tc);color:var(--tc);font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;white-space:nowrap}
.disc.fill{background:var(--tc);color:#fff}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
.slot{border:1.5px dashed var(--line);padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-width:0;font-size:.82rem}
.slot.has{border-style:solid;border-color:var(--tc)}
.slot .sl{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.resrow{display:flex;gap:10px;flex-wrap:wrap}
.resrow .r{display:flex;gap:5px;align-items:center;font-size:.72rem;font-weight:800;letter-spacing:.06em;color:var(--tc)}
.resrow .r i{width:10px;height:10px;border:1.5px solid var(--tc);transform:rotate(45deg)}
.resrow .r i.f{background:var(--tc)}
.abtn{border-color:var(--tc)!important}
.abtn small{display:block;font-size:.62rem;color:var(--tc)}
.btn.sub small{display:block;font-size:.62rem;opacity:.8}

/* hit shake */
.tok.hurt .h,.tok.hurt .hm,.vtok.hurt .vc,.vtok.hurt .vl{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-4px,1px) rotate(-4deg)}40%{transform:translate(4px,-1px) rotate(3deg)}60%{transform:translate(-3px,0)}80%{transform:translate(2px,0)}}
/* animation stage */
#stage{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
#stage .a-full{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#stage .a-flash{position:absolute;inset:0;background:#fff;mix-blend-mode:overlay}
#stage .a-orb,#stage .a-ring,#stage .a-slash,#stage .a-puff,#stage .a-spark,#stage .a-plus,#stage .a-throw,#stage .a-box{position:absolute;transform:translate(-50%,-50%)}
#stage .a-orb{border-radius:50%;background:#fff}
#stage .a-ring{border-radius:50%;border:4px solid}
#stage .a-slash{border-radius:50%;border:0 solid transparent;border-top:6px solid}
#stage .a-puff{border-radius:50%;background:#B9BECA;border:2px solid #151821}
#stage .a-spark{border:1.5px solid #151821}
#stage .a-plus{font-family:var(--sfx);-webkit-text-stroke:1.5px #151821;line-height:1}
#stage .a-box{overflow:visible}
#stage .a-beam{position:absolute;transform-origin:top center}
#stage .a-throw{border:2.5px solid #151821;background:#C92463;border-radius:35% 35% 14% 14%;display:flex;justify-content:space-around;align-items:flex-end;padding-bottom:0}
#stage .a-throw i{width:26%;height:38%;border-radius:50%;background:#151821;transform:translateY(45%)}
#stage .a-throw.rock{background:#8A7A66;border-radius:42% 58% 50% 46% / 55% 40% 60% 45%}
#stage .a-throw.rock i{display:none}
/* terrain + telegraphs */

/* Hybrid and capstone gear: every discipline mix up to 3 total ranks has items for at least 2 slots.
   Since v20 (ranks cap at 5) every discipline also has gear at rank 4 in at least 3 slots and at rank 5 in at least 2. */
/* Ouroboros gear, crafted from Scales */

/* Payload gear (Fuses) */
/* Gridlock gear (Lenses) */
/* balance pass: lift items that were weak for their requirement, trim the outliers */
/* Discipline rework (v20). The three disciplines run on different engines, and each caps at rank 5.
   Tech: abilities spend Power. Max Power = Tech rank + 1 per Tech item worn + bonuses (Version 124); it starts full and slowly recharges, 1 per round (+ recharge bonuses).
   Magic: spells spend Arcana. Max Arcana = Magic rank + the Magic rank each worn item requires + bonuses (Version 125); it starts full each fight and does not refill on its own.
   Innate: abilities are free but require Innate rank (Innate rank + bonuses) of at least ab.min, and a hero fires only one per round.
   ab.c = cost (Tech/Magic), ab.min = Innate rank required (Innate). ab.fx holds the effects. A value can be [a,b] = a + floor(b × Innate rank).
   ab.mode: 'ally' (pick yourself or an ally within r), 'tele' (move to an empty hex within r, then fx), 'strike' (an attack at range).
   Every Tech item has an ability. Every Magic weapon (Weapon slot) has a spell; other Magic items mostly carry passives instead. */
SLOTS.arms='Weapon';
Object.assign(MODN,{maxPwr:'max Power',pwrRegen:'Power recharge',maxArc:'max Arcana',pot:'Innate rank',arcWound:'Arcana when an attack tears a page',innUses:'Innate ability per round'});

   fx.boost = bonus movement on the hero's next move (u.boost), fx.jump makes that move a jump; gear.jumps = every move is a jump. */

function invEvents(k){const g=shuffle(EVENTS.filter(e=>!e.cond||e.cond()).map(e=>e.id)),own=VEVENTS[k];return own?g.slice(0,2).concat(pick(own).id):g.slice(0,3)}

/* Version 87 (Tyler): each starting-clue source only comes through 70% of the time */
const START_CLUE_P=.7;
function startInv(k){const notes=[];let c0=0;
  if(S.facilities.includes('comms')){if(Math.random()<START_CLUE_P){c0++;notes.push('Comms Array: +1 clue')}else notes.push('Comms Array: nothing')}
  {const fg=fieldGear('clue')[0];if(fg){if(Math.random()<START_CLUE_P){c0++;notes.push(`${GEAR[fg.g].name}: +1 clue`)}else notes.push(`${GEAR[fg.g].name}: nothing`)}}
  if(partyHas('senses'))notes.push('Keen Senses: +2 to rolls');fieldGear('roll').forEach(({g})=>notes.push(`${GEAR[g].name}: +2 to rolls`));
  S.inv={v:k,step:0,notes,clues:c0,events:invEvents(k),res:null,intro:true,peak:0,found:[],fresh:0};S.phase='inv';S.view='mission';intelSync();
  /* Version 84 (Tyler): Signal Intercept reveals a page instead of giving a clue */
  if(partyHas('intercept')){const pg=intelPool(k).filter(f=>f.kind==='page');if(pg.length){const f=pick(pg);markSeen(k,f.id);S.inv.found.push(f);S.inv.notes.push(`${party().find(h=>BASE(h).field&&BASE(h).field.id==='intercept').name}: 1 page revealed`)}}}
/* every new clue (peak count, so lost clues are not re-earned) opens one unseen playbook page or hit reaction */
function intelPool(k){const vs=vState(k),seen=(S.seen&&S.seen[k])||[],sr=(S.seenR&&S.seenR[k])||[];
  return [...[...new Set(vs.deck.map(e=>e.id))].filter(id=>!seen.includes(id)).map(id=>({kind:'page',id})),...VINTEL[k].react.filter(r=>!sr.includes(r.id)).map(r=>({kind:'rx',id:r.id}))]}
/* Version 79 (Tyler): overflow clues are the ones past the 4 needed for Prepared; each gives +1 intel (by peak, so lost clues are not re-earned) */
const PREP_CLUES=4;
function intelSync(){const i=S.inv;if(!i)return 0;let n=0;i.ovfFresh=0;
  while(i.clues>i.peak){i.peak++;if(i.peak>PREP_CLUES){S.intel++;i.ovf=(i.ovf||0)+1;i.ovfFresh++}const pool=intelPool(i.v);if(!pool.length)continue;const f=pick(pool);if(f.kind==='page')markSeen(i.v,f.id);else markSeenR(i.v,f.id);i.found.push(f);n++}
  i.fresh=n;return n}

/* hex board: pointy-top hexes stored as odd-r offset (x = column, y = row; odd rows sit half a hex right).
   Distances and shapes use axial (q,r). Board units: one hex is 1 wide, HS = side length. */
const HS=1/Math.sqrt(3);
const ax=p=>({q:p.x-((p.y-(p.y&1))>>1),r:p.y});
const off=(q,r)=>({x:q+((r-(r&1))>>1),y:r});

const FACE_DEG=[0,-60,-120,180,120,60];
function cheb(a,b){const A=ax(a),B=ax(b),dq=A.q-B.q,dr=A.r-B.r;return (Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2}
const step=(p,d)=>{const A=ax(p);return off(A.q+AXD[d][0],A.r+AXD[d][1])};
const nbrs=p=>AXD.map((_,d)=>step(p,d));
const inB=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
const HC=(x,y)=>({cx:x+.5+(y&1?.5:0),cy:HS+y*1.5*HS});
const BW=()=>N+.5,BH=()=>(1.5*N+.5)*HS;
function hexesWithin(p,r){const out=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(cheb({x,y},p)<=r)out.push({x,y});return out}

  return new Promise(res=>{const L=document.createElement('div');L.id='atk';L.setAttribute('role','dialog');L.setAttribute('aria-label',`${o.name} attacks: ${o.hits} hits, ${o.rows.filter(r=>r.ok).length} wounds`);
    const row=(r,dl)=>{const tc=r.tc,note=r.note?`<div class="note">${esc(r.note)}</div>`:'';
      const res=r.ok?'WOUND!':r.block?'BLOCKED!':'CLANG!',roll=r.block?esc(r.blockTxt):r.auto?`${tc.sig?esc(tc.n):'Weak point'}: the wound lands.`:`Strength roll <b>${r.r}</b> + ${r.str} = ${r.r+r.str} vs toughness ${r.tough}${r.r===20?' (natural 20)':r.r===1?' (natural 1)':''}`;
      return `<div class="arow"><div class="rx ${tc.sig?'sig':''} ${r.off?'off':''}">${dl}<span class="sfx">${esc(tc.sig?tc.sfx:TAC_SFX[tc.id]||'!')}</span><h4>${esc(tc.n)}</h4><div>${esc(tc.txt)}</div>${note}</div>
        <div class="st ${r.ok?'ok':''}"><span class="res">${res}</span><div>${roll}</div>${r.page?`<div class="torn">Torn out: ${r.page.sig?'★ ':''}${esc(r.page.n)}</div>`:''}</div></div>`};
    const isHit=d=>d===20||(d!==1&&d+o.acc>=o.eva),acc=(d,i)=>`<div class="dl"><span class="die ${isHit(d)?'hit':''}">${d}</span><small>Die ${i+1}: ${d} + ${o.acc} = ${d+o.acc} vs evasion ${o.eva}${d===20?' (natural 20)':d===1?' (natural 1)':''}</small></div>`;
    let k=0;const rows=o.rolls.map((d,i)=>{if(!isHit(d))return `<div class="arow"><div class="rx miss">${acc(d,i)}</div><div class="st"><span class="res">MISS</span><div>No hit card drawn.</div></div></div>`;
      const r=o.rows[k++];return r?row(r,acc(d,i)):`<div class="arow"><div class="rx">${acc(d,i)}</div><div class="st"><span class="res">—</span><div>The villain is already down.</div></div></div>`});
    L.innerHTML=`<div class="atkp"><div class="ah"><b>${esc(o.name)} attacks!</b><small>${o.rolls.length} ${o.rolls.length===1?'die':'dice'} · ${o.hits} hit${o.hits===1?'':'s'} · ${o.rows.filter(r=>r.ok).length} wound${o.rows.filter(r=>r.ok).length===1?'':'s'}</small></div>
      <div class="rows">${rows.join('')}</div></div><button class="btn pri cardgo" type="button">Continue</button>`;
    document.body.appendChild(L);const ready=Date.now()+(RM?150:450);const btn=L.querySelector('.cardgo');setTimeout(()=>btn.focus({preventScroll:true}),RM?0:300);
    const go=e=>{e.stopPropagation();if(Date.now()<ready)return;L.removeEventListener('click',go);L.classList.add('leaving');setTimeout(()=>{L.remove();res()},RM?0:200)};
    L.addEventListener('click',go)})}
/* a signature reaction stays in the hit deck while the page that carries it is still in the playbook */
const rxLive=(v,r)=>!r.src||[...v.deck,...v.discard].some(p=>p.id===r.src);
function breakSplash(title,sub,tag){if(FAST)return Promise.resolve();
  return new Promise(res=>{const L=document.createElement('div');L.id='brk';L.setAttribute('role','alert');
    L.innerHTML=`<div class="burst"><div class="bt"><span>${esc(tag)}</span><b>${esc(title)}</b><small>${esc(sub)}</small></div></div>`;document.body.appendChild(L);
    const t0=Date.now();let done=false;const go=()=>{if(done||Date.now()-t0<350)return;done=true;L.classList.add('leaving');setTimeout(()=>{L.remove();res()},RM?0:240)};
    L.addEventListener('click',e=>{e.stopPropagation();go()});setTimeout(go,RM?1600:2600)})}
/* several breaks from one attack stack in one overlay, each bursting in shortly after the last; one tap clears them all */
function breakStack(list){if(!list.length)return Promise.resolve();if(list.length===1)return breakSplash(...list[0]);if(FAST)return Promise.resolve();
  return new Promise(res=>{const L=document.createElement('div');L.id='brk';L.className='stack';L.setAttribute('role','alert');const gap=RM?0:420;
    L.innerHTML=list.map(([title,sub,tag],i)=>`<div class="burst" style="animation-delay:${i*gap}ms"><div class="bt"><span>${esc(tag)}</span><b>${esc(title)}</b><small>${esc(sub)}</small></div></div>`).join('');document.body.appendChild(L);
    const t0=Date.now(),all=(list.length-1)*gap;let done=false;const go=()=>{if(done||Date.now()-t0<all+350)return;done=true;L.classList.add('leaving');setTimeout(()=>{L.remove();res()},RM?0:240)};
    L.addEventListener('click',e=>{e.stopPropagation();go()});setTimeout(go,all+(RM?1600:2800))})}
/* a villain about to play a Signature Move shouts a hint; tearing that page first cancels it */
function vWarn(){const sd=S.sd;if(!sd)return;sd.vl.forEach(o=>{const v=o.v,top=v.deck[0];
  if(v.down||v.charge||!top||!top.sig||sd.result){v.warn=null;return}
  if(v.warn===top.uid)return;v.warn=top.uid;log('vill',`${VILLAINS[o.key].short} shouts: “${top.shout}”`)})}

/* ---------- combat ---------- */
function damageHero(u,n){const h=heroOf(u);if(u.stasis&&n>0){fxU(u,'NO EFFECT','good');log('hero',`Time Stop: ${h.name} takes no damage.`);return}if(S.cheat&&S.cheat.god){log('sys',`${h.name} shrugs off ${n} damage (invincible).`);return}if(n>1&&setOn(h,'architect')){n--;log('hero',`Load-Bearing: ${h.name} takes 1 less.`)}if(n>2&&auraOn(u,'brace')){n--;log('hero',`Shield Wall: ${h.name} takes 1 less.`)}if(u.dr&&n>0){const m=Math.max(1,n-u.dr);log('hero',`${h.name}'s guard soaks ${n-m} damage.`);n=m}if(u.absorb&&n>0){const m=Math.min(u.absorb,n);u.absorb-=m;n-=m;log('hero',`${h.name}'s shield absorbs ${m} damage${u.absorb?` (${u.absorb} left)`:' and fades'}.`)}h.hp-=n;u.hurtAt=Date.now();if(n>0&&h.hp>0)painGain(u,h);if(h.hp<=0&&!u.anti&&S.facilities.includes('antivenom')){h.hp=1;u.anti=true;fxU(u,'ANTIVENOM!','good');log('hero',`Antivenom Lab: ${h.name} stays on their feet with 1 health.`)}if(h.hp<=0){h.hp=0;u.ko=true;u.guard=false;log('vill',`${h.name} is down!`)}}
function harmCiv(c,why){const sd=S.sd;sd.civs=sd.civs.filter(o=>o!==c);sd.harmed++;fxP(c.x,c.y,'AAAH!','vhit');log('vill',`A civilian is hurt by ${why}.`)}
/* Civilians are saved on an exit hex (sd.exits). c.f = id of the hero they follow, c.held = id of the henchman dragging them. */
function mkExits(n,fin){const e=[`0,${n-1}`,`${n-1},${n-1}`];if(fin)e.push(`${Math.random()<.5?0:n-1},${Math.floor(n/2)}`);return e}
const isExit=p=>(S.sd.exits||[]).includes(p.x+','+p.y);
const followers=u=>S.sd.civs.filter(c=>c.f===u.hid);
const civHeld=c=>!!c.held&&S.sd.hench.some(m=>m.id===c.held);
const panicky=c=>!c.f&&!civHeld(c)&&!live().some(u=>cheb(u,c)<=1);
function saveCiv(c,u){const sd=S.sd;if(!sd.civs.includes(c))return;sd.civs=sd.civs.filter(o=>o!==c);sd.evac++;fxP(c.x,c.y,'SAVED!','good');
  const h=u&&heroOf(u);log('hero',h?`${h.name} gets a civilian out through the exit.`:'A civilian makes it out through an exit.');if(h&&gearHas(h,'rescue'))lifeline(u,h)}
function civHazard(c){const sd=S.sd,k=c.x+','+c.y;if(sd.haz.some(h=>h.k===k))harmCiv(c,'the molten floor');else if(litMap()[k])harmCiv(c,'a beam')}
function letGo(u,why){const fs=followers(u);fs.forEach(c=>c.f=null);if(fs.length&&why)log('hero',`${heroOf(u).name} ${why}`);return fs.length}
/* after a hero moves, the civilians they lead catch up through free hexes; a hero on an exit sends them all out */
function civFollow(u){const sd=S.sd,fs=followers(u);if(!fs.length)return;
  if(u.ko){letGo(u,'goes down, and the civilians scatter.');return}
  if(isExit(u)){fs.forEach(c=>saveCiv(c,u));return}
  const placed=[u],lim=stat(heroOf(u),'move')+3,near=p=>placed.some(o=>cheb(o,p)<=1);
  for(const c of fs.sort((a,b)=>cheb(a,u)-cheb(b,u))){
    if(near(c)){placed.push(c);continue}
    const r=reach(c,lim,c);let best=null,bd=1e9;for(const k in r){const[x,y]=k.split(',').map(Number);if(r[k]<bd&&near({x,y})){bd=r[k];best={x,y}}}
    if(best){c.x=best.x;c.y=best.y;placed.push(c);civHazard(c);if(isExit(c))saveCiv(c,u)}
    else{c.f=null;fxP(c.x,c.y,'WAIT!','miss');log('hero',`A civilian can't keep up with ${heroOf(u).name} and is left behind.`)}}}
function escort(){const sd=S.sd,u=sd.units[sd.sel];if(!u||u.ko||(u.acted&&!u.freeEvac))return;const h=heroOf(u),cs=sd.civs.filter(c=>c.f!==u.hid&&!civHeld(c)&&cheb(c,u)<=1);if(!cs.length)return;
  return act(async()=>{if(u.freeEvac)u.freeEvac=false;else u.acted=true;A.lunge('h'+u.hid,HC(cs[0].x,cs[0].y));await Promise.all(cs.map(c=>A.sparkle(HC(c.x,c.y),COL.yel)));
    cs.forEach(c=>{c.f=u.hid;fxP(c.x,c.y,'THIS WAY!','good')});log('hero',`${h.name} gathers ${cs.length} civilian${cs.length>1?'s':''}. They follow ${h.name} until they reach an exit.`);
    if(isExit(u))cs.forEach(c=>saveCiv(c,u))})}
/* villain turn: loose civilians with nobody beside them run 1 hex from the nearest threat; they may run into hazards or out an exit */
async function civPanic(){const sd=S.sd,T=[];sd.vl.forEach(o=>{if(!o.v.down)vCells(o.v).forEach(c=>T.push(c))});sd.hench.forEach(m=>T.push(m));(sd.bombs||[]).forEach(b=>T.push(bombP(b)));
  const scared=sd.civs.filter(panicky);if(!T.length||!scared.length)return;const dT=p=>Math.min(...T.map(t=>cheb(t,p)));let ran=0;
  for(const c of scared){if(!sd.civs.includes(c))continue;const d0=dT(c);
    const opts=nbrs(c).filter(n=>!blocked(n.x,n.y)).map(n=>({n,d:dT(n)+Math.random()*.4})).filter(o=>o.d>=d0+1).sort((a,b)=>b.d-a.d);
    fxP(c.x,c.y,pick(['HELP!','AIEE!','RUN!','EEK!']),'panic');c.panic=Date.now();
    if(opts.length){c.x=opts[0].n.x;c.y=opts[0].n.y;ran++}}
  log('vill',ran?`${ran} panicking civilian${ran>1?'s run':' runs'} from the fight.`:'The civilians cower in place.');render();await sleep(FAST?0:650);
  for(const c of scared){if(!sd.civs.includes(c))continue;civHazard(c);if(sd.civs.includes(c)&&isExit(c))saveCiv(c,null)}render()}
/* a henchman next to a loose civilian grabs them and drags them 1 hex toward its villain each turn instead of attacking */
async function henchGrab(hm){const sd=S.sd,o=sd.vl.find(o=>o.key===(hm.owner||sd.vkey)&&!o.v.down)||sd.vl.find(o=>!o.v.down);if(!o)return false;
  const vv=o.v,first=!sd.civs.some(c=>c.held===hm.id),cv=sd.civs.find(c=>c.held===hm.id)||sd.civs.find(c=>!c.f&&!civHeld(c)&&cheb(c,hm)<=1);if(!cv)return false;
  cv.held=hm.id;const dv=p=>dV(p,vv),n=nbrs(cv).filter(p=>!blocked(p.x,p.y)&&dv(p)<dv(cv)).sort((a,b)=>dv(a)-dv(b))[0];
  const hn=VILLAINS[o.key].hench.name;
  if(n){cv.x=n.x;cv.y=n.y;if(cheb(hm,cv)>1){const t=freeTiles((x,y)=>cheb({x,y},cv)===1).sort((a,b)=>cheb(a,hm)-cheb(b,hm))[0];if(t){hm.x=t.x;hm.y=t.y}}
    if(cheb(hm,cv)>1)cv.held=null;else{fxP(cv.x,cv.y,first?'GOTCHA!':'LET GO!','vhit');log('vill',first?`A ${hn.toLowerCase()} grabs a civilian and drags them toward ${VILLAINS[o.key].name}.`:`The ${hn.toLowerCase()} drags the civilian closer to ${VILLAINS[o.key].name}.`)}
    render();await sleep(FAST?0:350);civHazard(cv)}
  else{fxP(cv.x,cv.y,first?'GOTCHA!':'HELP!','vhit');log('vill',`A ${hn.toLowerCase()} holds a civilian hostage.`)}
  return true}
async function wardBlocks(u){if(!u.ward)return false;u.ward=false;await A.shield(ctrU(u),COL.magic,true);fxU(u,'WARDED!','good');log('hero',`A ward turns the blow aside from ${heroOf(u).name}.`);render();return true}
async function vHit(u,dmg,label,style){const h=heroOf(u);if(S.sd.v.cursed&&dmg>0)dmg=Math.max(1,dmg-2);faceTo(u);render();await strikeAnim(style,ctrV(),ctrU(u),COL.mag,'v'+S.sd.vi);
  let r=d20();/* Version 115 (Tyler): Lucky Coin no longer affects villain attacks */const acc=vStat('acc'),eva=stat(h,'eva')+(u.buffEva||0)+(u.evaNext||0);if(u.evaNext){log('hero',`Wind Ward: +${u.evaNext} evasion for ${h.name}.`);u.evaNext=0};const hit=r===20||(r!==1&&r+acc>=eva);
  log('vill',`${label} at ${h.name}: rolled ${r}+${acc} vs evasion ${eva}. ${hit?`Hit for ${dmg}.`:'Miss.'}`);
  if(hit&&await wardBlocks(u))return false;
  if(hit&&u.reflect&&!S.sd.v.down){u.reflect=0;log('hero',`${h.name} turns the blow back: ${VILLAINS[S.sd.vkey].short} tears a page.`);await woundAnim(`${h.name}: reflected.`)}
  fxU(u,hit?pick(SFX_VHIT):'SWISH!',hit?'vhit':'miss');if(hit)damageHero(u,dmg);render();if(!hit)await riposte(u);return hit}
/* Version 117 (Tyler): a conditional target (weakest, farthest) is picked only among heroes the villain can reach this turn
   (within move + range, by hex distance). If nobody is in reach it goes for the nearest hero. */
function pickTarget(mode,reach){const sd=S.sd;let L=live();if(!L.length)return null;
  if(reach!=null&&mode!=='nearest'){const inR=L.filter(u=>dV(u,sd.v)<=reach);if(inR.length)L=inR;else mode='nearest'}
  if(mode==='weakest')return L.slice().sort((a,b)=>heroOf(a).hp-heroOf(b).hp)[0];
  const byD=L.slice().sort((a,b)=>dV(a,sd.v)-dV(b,sd.v));return mode==='farthest'?byD[byD.length-1]:byD[0]}
function dmgScale(d){return d+Math.floor(S.sd.v.level/2)} /* Version 83 (Tyler): +1 damage at every even level */
function vStyle(c){if(c.fx)return c.fx;return (c.rng||0)>1||c.t==='endanger'?VILLAINS[S.sd.vkey].rstyle:'slash'}
async function vMove(fn,crush=0,label=''){const sd=S.sd,v=sd.v,ox=v.x,oy=v.y,osw=JSON.stringify(v.sw||0);const sh=fn()||[];const path=v.path;delete v.path;
  if(path&&path.length){const fin={x:v.x,y:v.y,body:v.body};for(const p of path){v.x=p.x;v.y=p.y;v.body=p.body;noFlip.add('v'+sd.vi);render();await sleep(FAST?0:RM?60:150)}v.x=fin.x;v.y=fin.y;v.body=fin.body}
  else if(v.x!==ox||v.y!==oy||JSON.stringify(v.sw||0)!==osw){render();await sleep(Math.min(520,180+90*Math.hypot(v.x-ox,v.y-oy)))}
  for(const o of sh){if(sd.units.includes(o)){if(o.ko)continue;if(crush){fxU(o,'CRUNCH!','vhit');damageHero(o,crush);log('vill',`${label||'The charge'} shoves ${heroOf(o).name} aside for ${crush} damage.`)}else{fxU(o,'SHOVED!','miss');log('vill',`${heroOf(o).name} is shoved aside.`)}}
    else if(sd.civs.includes(o)){if(crush)harmCiv(o,label||'the stampede');else fxP(o.x,o.y,'EEK!','miss')}}
  if(v.smashed&&v.smashed.length){const ks=v.smashed;delete v.smashed;await Promise.all(ks.map(k=>{const[x,y]=k.split(',').map(Number);return A.smoke(HC(x,y),3)}));fxV('KRASH!','vhit');log('vill',`${VILLAINS[sd.vkey].name} smashes straight through ${ks.length>1?ks.length+' hexes of walls and rubble':'a wall'}.`);render()}
  if(sh.length)render()}
async function execCard(c){const sd=S.sd,v=sd.v,vn=VILLAINS[sd.vkey].name;
  switch(c.t){
    case 'strike':{let t=pickTarget(c.tgt,(VILLAINS[sd.vkey].rooted?0:c.mv||0)+(c.rng||1));if(!t)break;await vMove(()=>vToward(t,c.mv,c.rng),c.crush||0,c.n);
      if(dV(t,v)>c.rng){log('vill',`${vn} can't reach ${heroOf(t).name}.`);fxV('GRR!','say');break}
      if(shotVB(t,v)){log('vill',`A girder is in the way: ${vn}'s ${c.n} can't reach ${heroOf(t).name}.`);fxV('GRR!','say');break}
      let dmg=dmgScale(c.dmg);const g=live().find(o=>o.guard&&o!==t&&cheb(o,t)<=2);
      if(g){log('hero',`${heroOf(g).name} braces and takes the blow.`);A.lunge('h'+g.hid,ctrU(t));await A.shield(ctrU(g),COL.yel,true);t=g;if(dmg>0)dmg=Math.max(1,dmg-1)}
      {const hit=await vHit(t,dmg,c.n,vStyle(c));if(hit&&c.comp&&!t.ko){const th=heroOf(t);th.comp=Math.max(0,th.comp-c.comp);fxU(t,'RATTLED!','vhit');log('vill',`${th.name} loses ${c.comp} composure.`);render()}}
      if(c.col)sd.civs.filter(cv=>cheb(cv,t)<=1).forEach(cv=>harmCiv(cv,'flying wreckage'));break}
    case 'sweep':await sweep(c.r,dmgScale(c.dmg),c.n);break;
    /* Version 133: Mole Boy digs under the floor and bursts up beside the farthest hero, leaving rubble where he went down */
    case 'burrow':{const t=pickTarget('farthest');if(!t)break;const from={x:v.x,y:v.y},sp=nbrs(t).filter(p=>inB(p.x,p.y)&&!(p.x===v.x&&p.y===v.y)&&vFits(p.x,p.y,true)).sort((a,b)=>cheb(a,from)-cheb(b,from))[0];
      if(!sp){log('vill',`${vn} can't find soft ground near ${heroOf(t).name}.`);fxV('GRR!','say');break}
      await A.smoke(ctrV(),3);vPut(v,sp.x,sp.y);noFlip.add('v'+sd.vi);const k0=from.x+','+from.y;if(!sd.obs.includes(k0))sd.obs.push(k0);render();await A.smoke(ctrV(),3);fxV('SHUNK!','say');
      log('vill',`${vn} dives underground and bursts up next to ${heroOf(t).name}, leaving rubble where he went down.`);await vHit(t,dmgScale(c.dmg),c.n,'slash');break}
    case 'rampage':{const t=pickTarget('nearest');if(t)await vMove(()=>vToward(t,c.mv,1),c.crush||0,c.n);await sweep(1,dmgScale(c.dmg),c.n);break}
    case 'summon':{const added=[];for(let i=0;i<c.k;i++){const t=freeTiles().sort((a,b)=>dV(a,v)-dV(b,v))[0];if(t){const m={id:'s'+Date.now()+i,owner:sd.vkey,x:t.x,y:t.y,hp:henchHp(2)};sd.hench.push(m);added.push(m)}}
      fxV('GET THEM!','say');render();await Promise.all(added.map(m=>A.smoke(ctrU(m))));log('vill',`${added.length} ${VILLAINS[sd.vkey].hench.name.toLowerCase()}s arrive.`);break}
    case 'endanger':{const cv=sd.civs.slice().sort((a,b)=>dV(a,v)-dV(b,v))[0];if(cv)faceTo(cv);
      if(!cv){const t=pickTarget('nearest');if(t){await vMove(()=>vToward(t,2,1));if(dV(t,v)<=1)await vHit(t,dmgScale(2),c.n,'slash')}break}
      await vMove(()=>vToward(cv,2,1));const prot=live().find(u=>cheb(u,cv)<=1);
      if(prot){A.lunge('h'+prot.hid,ctrU(cv));await strikeAnim(vStyle(c),ctrV(),ctrU(prot),COL.mag,'v'+S.sd.vi);log('hero',`${heroOf(prot).name} shields a civilian and takes ${dmgScale(c.dmg||2)}.`);
        if(!await wardBlocks(prot)){await A.shield(ctrU(prot),COL.yel);fxU(prot,'OOF!','vhit');damageHero(prot,dmgScale(c.dmg||2))}}
      else if(dV(cv,v)<=3){await strikeAnim(vStyle(c),ctrV(),ctrU(cv),COL.mag,'v'+S.sd.vi);harmCiv(cv,c.n)}
      else{log('vill',`${c.n} falls short. The civilian runs.`);fxP(cv.x,cv.y,'EEK!','miss')}break}
    case 'taunt':{await A.ring(ctrV(),COL.yel,c.r*2+2,{dashed:true,fill:false,count:3});
      const hit=live().filter(u=>dV(u,v)<=c.r);const lm=litMap(),ex=u=>(c.bombx&&(sd.bombs||[]).some(b=>cheb(bombP(b),u)<=1)?1:0)+(c.litx&&lm[u.x+','+u.y]?1:0);hit.forEach(u=>{const h=heroOf(u);h.comp=Math.max(0,h.comp-c.amt-ex(u));fxU(u,'GRR!','miss')});
      log('vill',hit.length?`${c.n}: ${hit.map(u=>heroOf(u).name).join(', ')} lose ${c.amt} composure.`:`${c.n}: nobody is close enough to hear.`);break}
    case 'vanish':{let best=null,bs=-1;for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(!vFits(x,y,true))continue;const s=Math.min(...live().map(u=>dV(u,{x,y})))+Math.random();if(s>bs){bs=s;best=[x,y]}}

    <p class="small" style="margin:0">A volume is a full campaign: ${ARCS} arcs of ${ISSUES_PER_ARC} issues, then an event comic finale. Each issue goes like this:</p>

    <p class="small muted" style="margin:0">Long-press any stat, item or keyword for details.</p>
    <div class="row"><button class="btn pri" data-a="guide:go">Recruit my team</button><button class="btn" data-a="guide:skip">I know how to play</button></div></div></div>`;
  const P={base:['Team assembled!','Your four heroes are ready. Your Workshop is already up and running for crafting gear. Next, build up the rest of your base: other facilities give you resources, healing and new options.','Go to base development','hq-base'],
    gear:['Base online!','Time to gear up. The armory has a starter locker: use Equip to… to hand items straight to a hero, or craft new gear in the Workshop.','Go to the workshop','hq-ws'],
    roster:['Suited up!','Before you investigate a villain, look over your roster. Check each hero\'s stats, power and gear, and make sure the right four are in the party.','Open the roster','roster']}[g.pop];
  if(!P)return '';
  return `<div id="guide" role="dialog" aria-modal="true" aria-labelledby="gtitle"><div class="gbox"><div class="eyebrow">Step ${g.s} of 4</div><div><span class="sfxhead" id="gtitle">${P[0]}</span></div>
    <p class="small" style="margin:0">${P[1]}</p><div class="row"><button class="btn pri" data-a="guide:open:${P[3]}">${P[2]}</button><button class="btn" data-a="guide:close">Not now</button></div></div></div>`}
/* ============ FIRST-TIME TIPS ============ */
/* one pop-up the first time each mechanic shows up; ids seen live in S.tips and carry into the next volume */
const inSd=()=>S.phase==='sd'&&S.sd&&!S.sd.result&&!S.sd.busy&&!S.sd.intro,sdV=f=>inSd()&&S.sd.vl.some(o=>!o.v.down&&f(o)),selH=()=>{const u=inSd()&&S.sd.sel!=null&&S.sd.units[S.sd.sel];return u?heroOf(u):null};
const atHQ=()=>S.phase==='hq'&&S.view!=='create'&&!S.guide;
const TIPS=[
  {id:'inv',when:()=>S.phase==='inv'&&S.inv&&S.inv.intro,t:'Investigation',b:()=>`Each issue, your party tracks one villain through 3 leads. <b>Every clue opens one unseen page</b> of the villain's playbook or one of their hit reactions, and the clue total decides how the fight starts: 0–1 an ambush, 2–3 a standoff, 4 or more prepared. The street hints tell you how this villain fights, so read them before you go.`},
  {id:'lead',when:()=>S.phase==='inv'&&S.inv&&!S.inv.intro&&S.inv.step<3&&!S.inv.res,t:'Working a lead',b:()=>`Pick how to work each lead. Options that roll use <b>a d20 plus bonuses</b> from field abilities and gear, and show the number you need. Risky options can hurt a hero or cost trust. The third lead is always the villain's own trail, built around how they operate.`},
  {id:'lair',when:()=>S.phase==='inv'&&S.inv&&S.inv.step>=3,t:'Finding the lair',b:()=>`Your clues set the showdown. <b>Ambush:</b> the villain acts first with an extra henchman and your heroes start scattered. <b>Standoff:</b> you enter from the south edge and act first. <b>Prepared:</b> change gear now, act first, and the villain starts with 1 page torn out.`},
  {id:'sd',when:()=>inSd(),t:'The showdown',b:()=>`Tap a hero to select them. Each round, every hero can <b>move once and take one action</b>. Then press End round and the villain plays the top page of its playbook. <b>The playbook is also its health:</b> every wound tears out a page, and when none are left it's beaten. There is no time limit: when it runs out of pages to play, its untorn pages are shuffled back in. <b>Escort</b> civilians to a green exit hex for trust, because harmed civilians cost trust. Civilians left alone panic and run on the villain's turn, and henchmen drag them off.`},
  {id:'attack',when:()=>inSd()&&S.sd.mode==='attack',t:'Attacking',b:()=>`Roll one d20 per attack die and add accuracy. <b>Each die that reaches the target's evasion is a hit.</b> A natural 20 always hits and a 1 always misses. Each hit on a villain draws a card from the hit deck, then rolls <b>d20 + strength against its toughness</b>. A success tears a page. Long-press a hero's stats to see their numbers.`},
  {id:'arcs',when:()=>!!selH(),t:'Facing and blind spots',b:()=>`The yellow arrow shows where the villain faces. The tinted hexes in front are its <b>front arc</b>. The shaded hexes behind are its <b>blind spot</b>, and attacks from there get +1 die. It turns toward whatever it moves to or attacks. Some signature hit reactions only trigger from certain sides, so read the playbook to learn which angle is safe.`},
  {id:'engines',when:()=>{const h=selH();return !!h&&!!(pwrMax(h)||arcMax(h)||potOf(h))},t:'Power, Arcana and Innate rank',b:()=>`Gear abilities and signature powers run on a hero's disciplines. <b>Tech</b> abilities spend Power, which slowly recharges. <b>Magic</b> spells spend Arcana: one pool per fight that doesn't refill on its own, so save it for big moments. <b>Innate</b> abilities spend nothing but require enough Innate rank, and each hero can fire one per round. The bars under the action buttons show what this hero has.`},
  {id:'multi',when:()=>inSd()&&S.sd.vl.length>1,t:'Two villains',b:()=>`More than one villain is on the board, and they act one after the other each round. Use the <b>Target</b> buttons, or tap a villain, to choose whose playbook you're tearing.`},
  {id:'sig',when:()=>sdV(o=>o.v.warn&&o.v.deck[0]&&o.v.deck[0].uid===o.v.warn),t:'Signature Move!',b:()=>`The villain just shouted a warning: its next page is a <b>Signature Move</b>, one of its most dangerous attacks. Every wound tears the <b>top</b> page, so land a wound before you end the round to rip it out before it fires.`},
  {id:'charge',when:()=>sdV(o=>o.v.charge),t:'Charged attack',b:()=>`The villain is winding up. On its next turn the <b>striped hexes</b> get hit instead of it playing a new page. Move out of them, or tear pages equal to the villain's level + 1 before then to stagger it.`},
  {id:'haz',when:()=>inSd()&&S.sd.haz&&S.sd.haz.length,t:'Hazard hexes',b:()=>`Orange hexes are a hazard. <b>Any hero standing on one when the villain's turn starts takes damage</b>, so step off before you end the round.`},
  {id:'walls',when:()=>inSd()&&S.sd.walls&&S.sd.walls.length,t:'Walls',b:()=>`Walls block movement and beams like rubble. Walls built into the lair stay all fight; walls the villain raises crumble after a few rounds. <b>Villains bigger than one hex smash straight through walls and rubble</b>, so cover won't stop them.`},
  {id:'pit',when:()=>inSd()&&S.sd.pits&&S.sd.pits.length,t:'Pits',b:()=>`Dark hexes are pits. <b>Nobody can walk into one, but shots and beams pass over.</b> A jumping hero can clear one pit hex for 2 movement, and villains bigger than one hex stride across.`},
  {id:'serpent',when:()=>sdV(o=>VILLAINS[o.key].shape==='serpent'),t:'A serpent villain',b:()=>`Ouroboros fills a chain of hexes and <b>its body follows its head</b>. Every civilian or henchman it swallows makes it one hex longer. Keep bystanders away from its mouth.`},
  {id:'swarm',when:()=>sdV(o=>VILLAINS[o.key].shape==='swarm'),t:'A swarm villain',b:()=>`Murmur is <b>three separate bodies</b>: a queen, a stinger and a shell. Each has its own facing, and you strike the body you aim at. A body with another body right beside it gets +2 toughness, so split them up.`},
  {id:'bomber',when:()=>sdV(o=>o.key==='bomber'),t:'A leaping bomber',b:()=>`Payload <b>vaults over the nearest hero</b> and leaves a lit bomb where they stood. A bomb goes off on its hex and every hex around it when its fuse runs out, so get 2 hexes clear. She can't jump a hero with no open hex behind them, and she always lands facing away from the hero she jumped.`},
  {id:'grid',when:()=>sdV(o=>o.key==='grid'),t:'A beam turret',b:()=>`Gridlock is <b>bolted to the floor</b>: he turns but never moves, and nothing can shove him. His beams run in straight hex lines to the edge of the board, and each one <b>stops at the first hero it hits and knocks them back</b> as many hexes as the damage. Walls and rubble block beams, so use them as cover. His Prisms split any beam that passes through them.`},
  {id:'beams',when:()=>inSd()&&S.sd.beams&&S.sd.beams.length,t:'Lit beams',b:()=>`Red lines are lit beams. They stay until the villain's next turn. <b>Stepping into a lit hex costs ${BEAM_HOT} damage and ends your move</b>, and a normal move can't cross one. Only a hero who is <b>jumping</b> (the move after Mighty Leap, Jet or Piston Leap, a Solar Dive, or any move in Gravity Boots or Earthshaker Greaves) can clear a single lit hex for 2 movement. Leaping abilities that land on a chosen hex fly over beams too. A hero who starts their turn in a beam can step out freely.`},
  {id:'hide',when:()=>sdV(o=>o.v.hide),t:'Hidden facing',b:()=>`Nocturne hides which way she faces. Her arrow shows a question mark and her arcs aren't shaded, but <b>they still count</b>. Every hit you land reveals her facing until she fades again.`},
  {id:'shaken',when:()=>inSd()&&S.sd.units.some(u=>!u.ko&&heroOf(u).comp<=0),t:'Shaken',b:()=>`A hero's composure (the blue bar) hit 0. They're <b>Shaken: −2 Strength, −2 accuracy, −2 evasion and −1 movement</b> until it's restored. Ending a fight at 0 composure leaves a lasting Rattled injury.`},
  {id:'ko',when:()=>inSd()&&S.sd.units.some(u=>u.ko),t:'Hero down',b:()=>`A knocked-out hero is out of this fight. After the mission they're back on their feet at half health, ready for the next issue. Nobody's career ends.`},
  {id:'after',when:()=>S.phase==='after'&&S.after&&!S.after.ethos,t:'Aftermath',b:()=>`Every hero on the mission earns XP, more if they landed 2 or more wounds. A win brings salvage for crafting. Villains you beat always <b>escape and come back a level stronger</b>, and beating one unlocks their facility blueprints. Every villain you didn't hunt moved its scheme forward.`},
  {id:'arc',when:()=>S.phase==='arc',t:'A new arc',b:()=>`Every free villain gains a level, adds new pages and upgrades old ones, and a new villain arrives. Once per arc a <b>Crossover Issue</b> lets an experienced hero join from HQ.`},
  {id:'tabs',when:()=>atHQ()&&roster().length>0,t:'HQ, Roster and Villains',b:()=>`Between missions there are three tabs. <b>HQ</b> is for recruiting, building the base and crafting gear. <b>Roster</b> is for the party, equipment and level-ups. <b>Villains</b> holds the case files, where you pick who to investigate. A tab <b>glows</b> when it needs you: HQ while you have resources or options to use, Roster when there is new gear or a hero has a choice to make, and Villains once you have checked the other two this issue.`},
  {id:'levelup',when:()=>atHQ()&&roster().some(h=>h.pendingUp>0),t:'Level up',b:()=>`A hero has enough XP to level up. Open the <b>Roster</b> and find the ★: pick which discipline they grow into (up to rank 5), then choose one upgrade. Benched heroes also earn 1 XP every issue.`},
  {id:'pouch',when:()=>atHQ()&&S.armory.some(g=>GEAR[g]&&GEAR[g].cons),t:'Consumables',b:()=>`The armory has <b>consumables</b>: cheap one-use items like Stim Shots and Smoke Pellets. Each hero carries up to ${POUCH_MAX} in a pouch, separate from their gear slots. Use them in a fight as a free action, or during investigations for the ones that give clues. Buy more in the Workshop panel, even before the Workshop is built.`},
  {id:'scheme',when:()=>atHQ()&&S.issue>=2&&S.villains.some(v=>v.status==='active'&&v.scheme>0),t:'Schemes',b:()=>`Every issue you don't hunt a villain, <b>its scheme meter fills</b> by one. When it's full, the villain strikes the city: −2 trust and it gains a level. You can only chase one villain per issue, so keep an eye on the meters on the <b>Villains</b> tab.`},
  {id:'sets',when:()=>atHQ()&&roster().some(h=>Object.values(h.gear).some(g=>GEAR[g]&&GEAR[g].set)),t:'Villain sets',b:()=>`Gear crafted from one villain's salvage belongs to that villain's <b>set</b> (the green tag on top of the item). <b>Wear ${SET_N} pieces of the same set</b> on one hero to turn on a set bonus themed on that villain. The hero card shows each set you're wearing just below the gear, and it glows once the bonus is on.`},
  {id:'salvage',when:()=>atHQ()&&Object.values(S.salvage).some(n=>n>0),t:'Salvage',b:()=>`You've got villain salvage. Spend it in the <b>Workshop</b> (Base development) to craft gear from your blueprints, then use Equip to… to hand it to a hero. "Any salvage" costs can be paid from any villain's salvage.`},
  {id:'event',when:()=>S.phase==='event',t:'The event comic',b:()=>`The volume's finale: <b>two villains attack together</b> on a bigger board, acting one after the other each round. Choose a preparation, then beat both to end the volume in triumph.`},
];
function tipNow(){if(S.tipsOff||FAST)return null;if(S.tut&&!(TUT[S.tut.b]&&TUT[S.tut.b].id==='free'))return null;const g=S.guide;if(g&&(g.s===0||g.pop))return null;if(S.view==='roster'&&S.phase==='hq')return null;
  if(S.tipAt&&Date.now()-S.tipAt<4000)return null;const seen=S.tips||[];return TIPS.find(t=>!seen.includes(t.id)&&t.when())||null}
function tipModal(){const t=tipNow();if(!t)return '';
  return `<div id="guide" class="tip1" role="dialog" aria-modal="true" aria-labelledby="gtitle"><div class="gbox"><div class="eyebrow">New mechanic</div><div><span class="sfxhead" id="gtitle">${t.t}</span></div>
    <p class="small" style="margin:0">${t.b()}</p><div class="row"><button class="btn pri" data-a="tip:ok:${t.id}">Got it</button><button class="btn" data-a="tip:off">Turn off tips</button></div></div></div>`}
function recruitPanel(){const n=roster().length,full=n>=ROSTER_MAX,arc=xArc(),xo=xoverOpen(),qb=Object.keys(HERO_BASE).filter(k=>!roster().some(h=>h.cls===k));
  const xl=xo?'Start a Crossover':arc<2?'Opens in Arc 2':arc<ARCS?`Used. Next one in Arc ${arc+1}`:'Used this arc';
  return `<section class="panel">${coll('hq-recruit',`<div><div class="eyebrow">Recruitment · ${n}/${ROSTER_MAX} heroes</div><h2>New heroes</h2></div>`,
    `${!n?'<div class="cap tilt"><b>The Blackharbor Guardians need four heroes.</b> Write an origin story for each hero, or grab a quick build to skip ahead. Every mission sends a party of 4, so fill all four spots before you investigate. The armory holds a starter locker of ten items to hand out once the team is set.</div>':''}
    ${full?'<p class="small muted" style="margin:0">The roster is full.</p>':''}
    <div class="grid2"><div class="card orec"><h3>Origin Story</h3><div class="small">Create a basic hero over six comic pages. Every choice shows what it does to them. Free: level 1, no gear, no HQ changes.</div><button class="btn pri" data-a="ostart:basic" data-tip="kw:origin" ${full?'disabled':''}>Write an origin</button></div>
      <div class="card orec xo"><h3>Crossover Issue</h3><div class="small">Recruit an Established Character from their own series. They arrive at level ${Math.max(2,arc)+1} or higher, with gear and HQ bonuses you choose. One per arc, from Arc 2.</div><button class="btn ${xo?'pri':''}" data-a="ostart:xover" data-tip="kw:crossover" ${xo&&!full?'':'disabled'}>${xl}</button></div></div>
    ${qb.length?coll('hq-qb',`<span class="eyebrow" data-tip="kw:quickbuild">Quick builds · ${qb.length}</span>`,`<p class="small muted" style="margin:0">The classic Guardians lineup, ready to go. Same rules as a basic hero: level 1 and no gear.</p><div class="grid2">${qb.map(qbCard).join('')}</div>`,!n,'nested'):''}`)}</section>`}

/* ============ GLOSSARY + LONG-PRESS DETAILS ============ */
const GLOSS={
  origin:['Origin Story','Create a basic hero over six comic pages: life before the mask, the incident (sets the discipline), the power, a fighting style, a motivation, and the mask. Each choice shows its exact effect. Basic heroes are free, start at level 1 with no gear and change nothing at HQ.'],
  crossover:['Crossover Issue','From Arc 2, once per arc, recruit an Established Character. They go through the same origin pages plus pages about their own series. They arrive at level arc + 1 (arc + 2 with a long-running title), with extra discipline ranks, signature upgrades, gear from your unlocked blueprints and a bonus for HQ.'],
  quickbuild:['Quick builds','The nine classic Guardians, ready made. They follow the basic hero rules: level 1 and no gear, but each is a veteran with +1 to their discipline: +1 max Power, +2 max health or +1 max Arcana. Each can be on the roster once.'],
  established:['Established Character','Recruited through a Crossover Issue. They joined at a higher level, with their own gear and a bonus for HQ.'],
  hp:['Health','Damage lowers health. At 0 the hero is knocked out of the fight, and is back at half health after the mission.'],
  move:['Movement','How many hexes the hero can move each round, one hex at a time. Heroes cannot pass through other units, civilians or rubble.'],
  speed:['Attack dice','How many d20s the hero rolls per attack. Each die that reaches the target\'s evasion (after accuracy) is a hit. A natural 20 always hits, a natural 1 always misses.'],
  acc:['Accuracy','Added to every attack die.'],
  str:['Strength','Added to the d20 wound roll. A wound roll must reach the villain\'s toughness to tear a page from its playbook.'],
  eva:['Evasion','Enemies roll a d20 plus their accuracy and must reach this number to hit the hero.'],
  range:['Range','How many hexes away the hero can attack. Range 1 means adjacent hexes only.'],
  comp:['Composure','The blue bar under each hero\'s health. The hero\'s nerve. Taunts and mind tricks drain it. At 0 the hero is Shaken. Ending a fight at 0 leaves a lasting Rattled injury.'],
  xp:['Experience','Each level costs one more XP than the last: 3, then 4, then 5. Heroes earn 1 XP per mission, +1 for landing 2 or more wounds, and +1 with a Training Room. Heroes recruited after the first issue start with 1 XP for every issue already completed.'],
  tech:['Tech discipline','Gadgets and engineering. Tech abilities spend Power: max Power is your Tech rank + 1 for each Tech item you wear, plus bonuses from your origin and gear. It starts full and slowly recharges: 1 Power each round, more with recharge bonuses. Every Tech item has an ability. Each ability and power can be used once per round. Ranks give no stats by themselves. Rank 5 is the capstone: +2 accuracy and +1 Power recharge.'],
  innate:['Innate discipline','Natural powers pushed further. Innate abilities spend nothing. Instead each requires a minimum Innate rank, and a hero can fire only one Innate ability per round. Many grow stronger with your Innate rank. Ranks give no stats by themselves. Rank 5 is the capstone: +4 max health and a second Innate ability once per fight, which comes back after any round in which you use no abilities.'],
  magic:['Magic discipline','Spells, relics and wards. Magic spells spend Arcana: max Arcana is your Magic rank + the Magic rank each item you wear requires, plus bonuses. It starts full each fight and does not refill on its own, so spells hit harder than Tech abilities. Each spell and power can be cast once per round. Every Magic weapon carries a spell; most other Magic items give passive bonuses instead. Ranks give no stats by themselves. Rank 5 is the capstone: +2 max composure and +1 Arcana whenever an attack tears a page.'],
  'res:tech':['Power','Tech pool. Max = Tech rank + 1 per Tech item worn + bonuses. Full at the start of each fight, then slowly recharges: 1 per round plus recharge bonuses. Spent on Tech gear abilities.'],
  'res:innate':['Innate rank','Innate threshold, not a pool. An Innate ability works only if your Innate rank meets its number, many grow with it, and each hero can fire one Innate ability per round.'],
  'res:magic':['Arcana','Magic pool. Max = Magic rank + the Magic rank each worn item requires + bonuses. Full at the start of each fight and it does not refill each round. Only a few things restore it: Circuit Siphon, the Bloodstone, the Philosopher\'s Stone, Martyr\'s Vestments, the Guardian Locket and Magic rank 5.'],
  slot:['Gear slots','Head, Body, Main Hand, Off Hand, Legs, two Accessories and a Belt. Each slot holds one item. Main Hand weapons hit hardest; Off Hand items are defensive or lighter. Paired weapons go in either hand. A two-handed weapon fills both hands. Weapon and Body gear is the strongest and costs the most, then Head and Legs, then Accessories and Belts. Weapons carry most of the attack stats. Consumables go in a separate pouch of 2. Equipping needs the listed discipline ranks. Every Magic weapon carries a spell.'],
  paired:['Paired weapons','Some Tech and Innate weapons are Paired: they go in either hand and have off-hand stats. Hold the same weapon in both hands and both count in full (stats and set count), plus the pair bonus. Its ability is still one button. Craft it twice to pair it.'],
  blinded:['Blinded','The villain has −4 accuracy until the end of the round.'],
  excise:['Find the Flaw','The next page torn from this villain this round is one you choose from the top of its playbook, so you can rip out a Signature Move or its worst page.'],
  riposte:['Riposte','The first time the villain misses this hero this round, the hero strikes back with a free 1-die attack, if the villain is within their range.'],
  relent:['Relentless','Attacking the same villain round after round keeps up the pressure: +1 die if you also attacked it last round. Skip a round and it resets.'],
  aura:['Aura','Gear that helps the wearer and every ally within 2 hexes. Some auras add stats, and stat auras from different heroes add up. Others only work under a condition: healing or composure while at half or less, extra Power while nearly empty, less damage from big hits, or the first attack on you each round rolling twice and keeping the lower die.'],
  shaken:['Shaken','A hero with 0 composure. They get −2 Strength, −2 accuracy, −2 evasion and −1 movement (minimum 1) until composure is restored.'],
  dazed:['Dazed','The hero cannot move next round. They can still act.'],
  windward:['Wind Ward','The next attack against this hero, from the villain or a henchman, gets the listed evasion bonus. It is used up by that attack, hit or miss, and lasts until then.'],
  absorb:['Absorb shield','From Arcane Aegis or Carapace. Absorbs the listed amount of damage from incoming hits, after any guard reduction, then fades. It lasts until used up or the fight ends.'],
  warded:['Warded','The next hit against this hero is turned aside completely.'],
  braced:['Braced','Until the villain acts, its attacks on allies within 2 hexes hit this hero instead, for 1 less damage (never below 1).'],
  hexed:['Hexed','The villain has −4 evasion until the end of the round.'],
  boost:['Bonus movement','This hero\'s next move goes farther. If it says jump, that move can also clear one lit beam hex. It lasts until the hero moves, even into the next round.'],
  jumps:['All moves are jumps','Every move this hero makes is a jump, so it can clear one lit beam hex for 2 movement.'],
  set:['Villain set','Gear crafted from one villain\'s salvage belongs to that villain\'s set. Wear 4 pieces of the same set at once to turn on its set bonus. The hero card shows each set you are wearing just below your gear.'],
  buff:['Charged attack','A bonus from gear that applies to this hero\'s next attack, then is used up. Unused charges fade at the end of the round.'],
  trust:['Public trust','How much Blackharbor believes in the team. Saving civilians raises it. Harmed civilians, failures and villain schemes lower it. At 0 the team disbands.'],
  techres:['Tech','Spare parts and hardware. Spent on base facilities and research. Gear and consumables cost only salvage.'],
  intel:['Intel','Information networks and files. Spent on facilities, research and investigation options.'],
  salvage:['Villain salvage','Coils from Dr. Gallows, Shards from Mother Quarry, Ledgers from The Cantor, Rebar from The Architect, Sunstone from Helios Prime, Scales from Ouroboros, Lodestones from Lodestone, Umbra from Nocturne, Chitin from Murmur and Fuses from Payload. Earned by winning lair showdowns and used to craft gear.'],
  scheme:['Scheme','Each issue you don\'t hunt a villain, their scheme advances. When it fills, they strike the city: −2 trust and they gain a level.'],
  vlevel:['Villain level','Each level adds 3 new, stronger pages to the playbook. Every level adds +1 evasion, toughness and accuracy, and every 3 add +1 damage. A villain beaten in their lair escapes and comes back 1 level higher.'],
  playbook:['Playbook','The villain\'s deck of moves, and also its health. Each turn it plays the top page. Each wound tears a page out. When no pages remain, it is defeated.'],
  discard:['Discard','Pages the villain has already played this fight. They are shuffled back in when the playbook runs out.'],
  wound:['Wounds','Pages torn from the playbook this fight. The villain can no longer use them.'],
  facing:['Facing','The yellow arrow shows which way the villain faces. It turns toward whatever it last moved toward or attacked. Attacks from the blind spot behind it get +1 die.'],
  blind:['Blind spot','The narrow cone behind a villain, shaded on the board. Attacks from a blind-spot hex get +1 die. The villain turns as it moves and attacks, so the blind spot moves too.'],
  facearc:['Arcs','Every villain has a front arc (the way it faces), two side arcs, and a rear arc (the shaded blind spot). Attacks from the rear get +1 die. Some signature hit reactions only trigger in certain arcs, so read the playbook and pick your angle: some villains punish a head-on attack, others guard their back.'],
  vhide:['Hidden facing','Nocturne hides which way she faces. Her arrow shows a question mark and her arcs are not shaded, but they still count. Every hit you land reveals her facing until she fades again, and her Spotlight reveals it too.'],
  swarm:['Swarm','Murmur is three separate 1-hex bodies: a queen, a stinger and a shell. Each has its own facing, and you strike the body you aim at, so arcs are measured from that body. A body with another body right beside it gets +2 toughness. Each body carries one hit reaction that fires only when you strike that body. Tear the page it hangs on and the body falls out of the swarm. Recover the page and it re-forms.'],
  vsize:['Villain size','Villains fill 1, 4 or 7 hexes. Ouroboros is a 5-hex serpent whose body follows its head, and it grows one hex longer for every civilian or henchman it swallows. Murmur is a swarm of three separate 1-hex bodies. Each villain also has a size from 1 to 4 (1 for one hex, 3 for four hexes, 4 for five or more), shown in its case file: Ground Quake only shoves a villain whose size is no more than the hero\'s Innate rank. Anything bigger than one hex shoves heroes, henchmen and civilians out of its path when it moves. Some moves deal damage to whoever is shoved.'],

  reaction:['Hit reactions','Signature cards each villain adds to the hit deck: armor, counters that punish adjacent attackers, mind tricks and escapes. Uncover them with clues, or by drawing them in a fight. Each one lives on a playbook page: tear that page out and the reaction leaves the hit deck. Known ones appear at the back of the playbook.'],

  gearup:['Surprise gear-up','With 4 or more clues you catch the villain by surprise and can change your party\'s gear right before the showdown.'],
  clues:['Clues','Gathered while investigating. 0–1 means an ambush, 2–3 a standoff, 4 or more means you arrive prepared and can change gear first. Each new clue also reveals one playbook page or hit reaction.'],
  q_ambush:['Ambush','The villain acts first, with an extra henchman, and your heroes start scattered.'],
  q_normal:['Standoff','Heroes enter from the south edge and act first.'],
  q_prepared:['Prepared','You can change gear before entering, you act first, and the villain starts with 1 page already torn out. +1 salvage on a win.'],
  civilian:['Civilians','Bystanders caught in the fight. Escort them to an exit for +1 trust each. Villain attacks can harm them, which costs trust. On the villain\'s turn, a civilian with no hero beside them (marked !) panics and runs 1 hex from the nearest threat, maybe into a hazard. A henchman next to a loose civilian grabs them and drags them toward its villain until you knock it out. Civilians still on the board at the end cost nothing.'],
  exit:['Exits','Green hexes on the edge of the board. A civilian who reaches one is saved, and a hero who steps on one sends every civilian following them out.'],

  elite:['Special henchman','A tougher lieutenant with a yellow border, brought by some villains from level 3. Health 2 + the villain level, harder to hit, +4 to hit you, and 1 + half the villain level in damage. Taking one down is worth 1 of that villain\'s salvage. The Cantor\'s Made Man is her bodyguard: while he stands next to her, he takes the first hit of every hero attack on her. Dr. Gallows\' Failed Experiment moves only 2, hits 1 harder and shrugs off the first hit each round. Ouroboros\' High Priest attacks from range 3 and raises a fallen Cultist each round while fewer than 2 remain. The Architect\'s Foreman bolts a girder next to the hero closest to the Architect each round: it is a wall that blocks shots (attacks from 2+ hexes away whose line crosses it), and after 2 villain turns it topples onto an adjacent hero for 2 + half the Architect\'s level.'],

  pit:['Pit','A hole in the floor. Nobody can walk into one, but shots and beams pass over it. A hero who is jumping can clear one pit hex for 2 movement. Villains bigger than one hex stride right across.'],
  bomb:['Bombs','Payload\'s bombs sit on a hex with a fuse number. At the start of each villain turn every fuse ticks down 1, and at 0 the bomb goes off for its damage on its own hex and every hex around it, hitting heroes, civilians and henchmen. Her bombs never hurt her. Hexes about to blow are striped red. A Sapper next to a bomb when it goes off adds 1 damage. At most 4 bombs can be lit at once.'],
  haz:['Molten floor','Hazard hexes. Any hero standing on one when the villain starts its turn takes the listed damage. Move off before ending the round.'],
  charge:['Charged attack','A telegraphed move. The marked hexes get hit on the villain\'s next turn, in place of a new page. Move out, or tear pages equal to the villain\'s level + 1 before then to stagger it. Eclipse cancels it outright.'],
  vlead:['Villain trail','The third lead of every investigation is always one of the villain\'s own leads, built around how they operate.'],
  blueprint:['Blueprints','Facilities and gear start locked. Gear blueprints of tier 0 and 1 are open from the start, tier 2 opens in Arc 2, tier 3 at issue 10 (halfway through Arc 2), and tier 4 and 5 in Arc 3 (tier is the total rank an item needs). Some facilities open in later Arcs or by beating specific villains in their lairs. Skunkworks research and special investigation leads can get blueprints early.'],
  party:['Active party','Up to 4 heroes go on each mission. Change the party in the roster at HQ. Benched heroes recover fully and gain 1 XP every issue.'],
  field:['Field ability','A hero ability that works outside combat, during investigations or at the start of each issue, as long as the hero is in the active party.'],

  marked:['Marked','Every hero attack against this villain from a side arc or the blind spot gets +1 die until the round ends. Each hero can mark once per fight.'],
  cursed:['Cursed','This villain deals 2 less damage with its attacks until the round ends, but every hit still deals at least 1.'],
  pouch:['Pouch and consumables','Each hero carries up to 2 consumables in a pouch, separate from their 8 gear slots. Consumables cost 1 or 2 salvage, need no Workshop and no discipline ranks, and are gone after one use. In a fight they are free actions. Some are used during investigations instead.'],
  capstone:['Capstone','Discipline ranks give no stats by themselves: they grow the engine and open higher gear. Reaching rank 5 in a discipline grants its capstone. Tech: +2 accuracy and +1 Power recharge. Innate: +4 max health and a second Innate ability once per fight, which comes back after any round in which you use no abilities. Magic: +2 max composure and +1 Arcana whenever an attack tears a page.'],

  engines:['Discipline engines','Tech runs on Power (slowly recharges), Magic on Arcana (one pool per fight, bigger spells), Innate on your Innate rank (free abilities above a threshold, one per round). Signature powers run on the engine of their discipline too. A hero only has the engines of disciplines they have ranks in.'],

function tutGo(i){const t=S.tut;t.b=i;const B=TUT[i];if(B&&B.dq)t.dq=B.dq.slice();if(B&&B.enter)B.enter()}
function tutTick(){if(!tutOn())return;const sd=S.sd;
  if(sd&&sd.patrol&&!sd.result&&!sd.busy&&!sd.hench.length){sd.result='win';sd.sel=null;sd.mode=null;log('sys','Patrol cleared. The subway is safe.')}
  for(let g=0;g<6;g++){const B=TUT[S.tut.b];if(!B||!B.done||!B.done())break;tutGo(S.tut.b+1)}}

  if(win){S.salvage.mole+=3;L.push('Salvaged 3 Grit from the tunnel.')}else L.push('The team is dragged out of the tunnel, a little dusty. No harm done.');
  const xp=[];sd.units.forEach(u=>{const h=heroOf(u);h.xp+=1;xp.push(`${h.name} +1`);h.hp=stat(h,'maxHp');h.comp=stat(h,'maxComp')});L.push(`XP earned: ${xp.join(', ')}.`);

function tutFresh(){const keep={tips:S.tips,seen:S.seen,seenR:S.seenR,tipsOff:S.tipsOff};newCampaign();Object.assign(S,keep);tutClose()}
function tutAct(p){switch(p){
  case 'start':tutStart();scrollTo(0,0);break;
  case 'no':S.tut=null;S.tutDone=true;break;
  case 'next':{const B=tutBeat();if(!B||!B.next||(B.wait&&!B.wait()))break;if(B.go)B.go();tutGo(S.tut.b+1);break}
  case 'skip':if(tutOn())tutSkip();break;
  case 'hq':if(S.sd&&S.sd.patrol&&S.sd.result)tutPatrolEnd();scrollTo(0,0);break;
  case 'fight':tutBoss();scrollTo(0,0);break;
  case 'keep':if(S.phase==='tutend')tutKeep();scrollTo(0,0);break;
  case 'fresh':if(S.phase==='tutend')tutFresh();scrollTo(0,0);break}}

   --fl floor, --wall/--wallc wall band and hub, --pit, --haz, --rub rubble art, --rc move highlight, --bgap grout and --edge cell rim.

.ic.u{stroke:none;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.chip .ic.u{margin-right:5px;color:var(--muted)}
.chip .vic{width:1.35em;height:1.35em;margin-right:4px;border-width:1px;vertical-align:-.3em}
.chip.trust .ic.u{color:var(--cyan)}
.nav .btn .ic.u{margin-right:6px;width:1.25em;height:1.25em;vertical-align:-.25em}
.btn.sm .ic.u{margin-right:3px;width:1em;height:1em;vertical-align:-.15em}
.stats.ico .stat{display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 2px}
.stats.ico .stat .ic.u{width:15px;height:15px;color:var(--muted)}
.stats.ico .stat b{display:inline;font-size:.95rem}
.hst{display:inline-flex;gap:6px;align-items:center}.hst .ic.u{width:18px;height:18px;color:var(--good)}.hst .used .ic.u{color:var(--line)}
.hline .ic.u{color:var(--muted);margin:0 2px 0 0}
.card summary .vic{width:20px;height:20px;margin-right:0}
.cost .vic,.cost .ic.u{margin-right:3px}
.vbadge{width:34px;height:38px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#151821;display:grid;place-items:center;position:relative;flex:none}
.vbadge::before{content:"";position:absolute;inset:2.5px;clip-path:inherit;background:var(--vc)}
.vbadge .ic{position:relative;z-index:1;width:24px;height:24px;color:#fff}

/* villain-styled playbook pages */
.vth .pg:not(.sig){box-shadow:8px 8px 0 var(--vc),8px 8px 0 2px #151821}
.vth .pg .hd{background:var(--vc);color:#fff;margin:-12px -12px 0;padding:7px 12px 6px;border-bottom:2.5px solid #151821;align-items:center}
.vth .pg .hd .ic{width:1.6em;height:1.6em;vertical-align:-.5em;margin-right:5px;color:#fff}
.vth .pg.sig .hd{background:#151821;color:#F1C02C}
.vth .pg .art{position:relative;overflow:hidden}
.vth .pg:not(.sig) .art:not(.unk):not(.tac){background-color:var(--vc)}
.vth .pg .art>span{position:relative;z-index:1}
.vth .pg:not(.sig) .art:not(.tac)>span{color:var(--ac)}
.pg .art>.ic.wm{position:absolute;width:auto;height:118%;aspect-ratio:1;right:-12%;bottom:-22%;color:#fff;opacity:.28;transform:rotate(-12deg);stroke-width:.8}
.pg.sig .art>.ic.wm{color:#F1C02C;opacity:.22}
.vth .pbcover{color:#fff;background-color:color-mix(in srgb,var(--vc) 60%,#151821);background-image:radial-gradient(color-mix(in srgb,var(--ac) 45%,transparent) 1.6px,transparent 2px);position:relative}
.vth .pbcover>*{position:relative;z-index:1}
.vth .pbcover .ctag{color:var(--ac)}
.pbcover>.ic.wm{position:absolute;z-index:0;width:50%;height:auto;aspect-ratio:1;right:-5%;top:24%;color:#fff;opacity:.9;transform:rotate(8deg);filter:drop-shadow(5px 5px 0 #151821)}
